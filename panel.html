<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Verdadera Destreza</title>
<style>
:root { --fondo: #f4ecd8; --tinta: #2b2118; --suave: #7a6a58; --sangre: #8a1c1c; --linea: #cdbf9f; --caja: #fffaf0; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --fondo: #1b1612; --tinta: #eadfc8; --suave: #a8987f; --sangre: #e07a6a; --linea: #4a3f33; --caja: #241d17; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font: 15px/1.45 Georgia, "Times New Roman", serif; padding: 16px max(16px, env(safe-area-inset-left, 0px)); padding-block: 20px; }
main { max-width: 860px; margin: 0 auto; }
h1 { color: var(--sangre); font-size: 24px; margin: 0 0 4px; font-weight: normal; font-variant: small-caps; letter-spacing: .5px; }
h2 { font-size: 17px; margin: 24px 0 8px; font-weight: normal; font-variant: small-caps; color: var(--sangre); }
p { margin: 6px 0; }
.suave { color: var(--suave); font-size: 13px; }
form { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
input { flex: 1 1 200px; min-width: 0; padding: 9px; font: inherit; background: var(--caja); color: var(--tinta); border: 1px solid var(--linea); border-radius: 3px; }
button { padding: 9px 16px; font: inherit; background: var(--sangre); color: #fff; border: 0; border-radius: 3px; cursor: pointer; }
.resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 14px 0; }
.dato { background: var(--caja); border: 1px solid var(--linea); border-radius: 3px; padding: 10px 12px; }
.dato b { display: block; font-size: 24px; color: var(--sangre); font-weight: normal; }
.tabla { overflow-x: auto; border: 1px solid var(--linea); border-radius: 3px; background: var(--caja); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--linea); white-space: nowrap; }
th { font-weight: normal; color: var(--suave); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
td.n, th.n { text-align: right; }
.coment { white-space: normal; display: inline-block; min-width: 200px; max-width: 420px; }
.error { color: var(--sangre); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Panel de Verdadera Destreza</h1>
  <p class="suave">Quién entra, cuánto juega y cuándo. Solo para el autor: necesita la contraseña.</p>
  <form id="f">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button type="submit">Ver</button>
  </form>
  <p id="msg" class="suave" role="status"></p>
  <div id="datos" hidden>
    <div class="resumen" id="resumen"></div>
    <h2>Jugadores</h2>
    <div class="tabla"><table id="t-jug"></table></div>
    <h2>Resultados por nivel del rival</h2>
    <div class="tabla"><table id="t-niv"></table></div>
    <h2>Cada jugador contra cada nivel</h2>
    <div class="tabla"><table id="t-jn"></table></div>
    <h2>Actividad por día</h2>
    <div class="tabla"><table id="t-dia"></table></div>
    <h2>Opiniones</h2>
    <div class="tabla"><table id="t-op"></table></div>
    <h2>Últimas partidas</h2>
    <div class="tabla"><table id="t-par"></table></div>
  </div>
  </main>
<script>
const URL_BASE = 'https://hbcalubchyzzxdjjgzzt.supabase.co';
const CLAVE_PUBLICA = 'sb_publishable_UKYAYdRbtw8sXVn4xvMsnw_NqT5WuYq';
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fecha = (x) => (x ? new Date(x).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
async function rpc(fn, clave) {
  const r = await fetch(`${URL_BASE}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: CLAVE_PUBLICA, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_clave: clave }) });
  if (!r.ok) { const e = new Error('http ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
const NIVELES = { bisono: 'Bisoño', discipulo: 'Discípulo', diestro: 'Diestro', preboste: 'Preboste', maestro: 'Maestro' };
const ORDEN = Object.keys(NIVELES);
const nombreNivel = (n) => NIVELES[n] ?? n;
const pct = (g, n) => (Number(n) ? Math.round((100 * Number(g)) / Number(n)) + ' %' : '·');
const n1 = (x) => (Math.round(Number(x) * 10) / 10).toString().replace('.', ',');
function hace(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 3) return '● conectado ahora';
  if (m < 60) return `hace ${m} min`;
  if (m < 1440) return `hace ${Math.floor(m / 60)} h`;
  return `hace ${Math.floor(m / 1440)} d`;
}
function tabla(id, cab, filas) {
  $(id).innerHTML = '<thead><tr>' + cab.map(([t, num, ayuda]) => `<th class="${num ? 'n' : ''}"${ayuda ? ` title="${esc(ayuda)}"` : ''}>${t}</th>`).join('') + '</tr></thead><tbody>' +
    (filas.length ? filas.map((f) => '<tr>' + f.map((c, i) => `<td class="${cab[i][1] ? 'n' : ''}">${c}</td>`).join('') + '</tr>').join('') : `<tr><td colspan="${cab.length}" class="suave">Sin datos todavía</td></tr>`) + '</tbody>';
}
$('#f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = $('#msg');
  msg.className = 'suave'; msg.textContent = 'Cargando…';
  const c = $('#clave').value;
  try {
    const [jug, niv, par, dias, ops] = await Promise.all(['resumen_admin', 'niveles_admin', 'ultimas_admin', 'dias_admin', 'opiniones_admin'].map((f) => rpc(f, c)));
    const ahora = Date.now();
    const suma = (k) => jug.reduce((a, j) => a + Number(j[k]), 0);
    const conect = jug.filter((j) => ahora - new Date(j.ultima_vez) < 180000).length;
    const vuelven = jug.filter((j) => Number(j.dias) > 1).length;
    const media = ops.length ? ops.reduce((a, o) => a + o.estrellas, 0) / ops.length : null;
    $('#resumen').innerHTML = [
      [conect, 'conectados ahora'], [jug.length, 'jugadores'], [vuelven, 'han vuelto otro día'],
      [suma('n_partidas'), 'partidas'], [pct(suma('n_ganadas'), suma('n_partidas')), 'victorias de los jugadores'],
      [Math.round(suma('minutos')), 'min. jugando'], [Math.round(suma('abierto_min')), 'min. con el juego abierto'],
      [media === null ? '·' : n1(media) + ' ★', `valoración media (${ops.length})`],
    ].map(([n, t]) => `<div class="dato"><b>${n}</b>${t}</div>`).join('');
    tabla('#t-jug', [['Apodo'], ['Estado'], ['Primera vez'], ['Visitas', 1], ['Días', 1, 'Días distintos en que ha jugado'], ['Abierto (min)', 1, 'Tiempo con el juego abierto'], ['Jugando (min)', 1, 'Suma de la duración de sus partidas'], ['P', 1], ['G', 1], ['%', 1], ['Tocados', 1, 'Dados – recibidos'], ['DT', 1], ['MS', 1]],
      jug.map((j) => [esc(j.apodo), hace(ahora - new Date(j.ultima_vez)), fecha(j.primera_vez), j.visitas, j.dias, n1(j.abierto_min), n1(j.minutos), j.n_partidas, j.n_ganadas, pct(j.n_ganadas, j.n_partidas), `${j.dados} – ${j.recibidos}`, j.dobles, j.subitas]));
    const cabNiv = (primera) => [primera, ['P', 1], ['G', 1], ['%', 1], ['Tocados', 1, 'Dados – recibidos, en total'], ['Por partida', 1, 'Tocados dados – recibidos de media'], ['DT', 1], ['MS', 1], ['Min', 1]];
    const global = {};
    for (const x of niv) {
      const g = (global[x.nivel] ??= { p: 0, g: 0, d: 0, r: 0, dt: 0, ms: 0, m: 0 });
      g.p += Number(x.n_partidas); g.g += Number(x.n_ganadas); g.d += Number(x.dados); g.r += Number(x.recibidos); g.dt += Number(x.dobles); g.ms += Number(x.subitas); g.m += Number(x.minutos);
    }
    const orden = (a, b) => (ORDEN.indexOf(a) + 1 || 99) - (ORDEN.indexOf(b) + 1 || 99);
    tabla('#t-niv', cabNiv(['Nivel']), Object.keys(global).sort(orden).map((k) => { const g = global[k]; return [nombreNivel(k), g.p, g.g, pct(g.g, g.p), `${g.d} – ${g.r}`, `${n1(g.d / g.p)} – ${n1(g.r / g.p)}`, g.dt, g.ms, n1(g.m)]; }));
    tabla('#t-jn', cabNiv(['Jugador · nivel']), [...niv].sort((a, b) => a.apodo.localeCompare(b.apodo) || orden(a.nivel, b.nivel))
      .map((x) => [`${esc(x.apodo)} · ${nombreNivel(x.nivel)}`, x.n_partidas, x.n_ganadas, pct(x.n_ganadas, x.n_partidas), `${x.dados} – ${x.recibidos}`, `${n1(x.dados / x.n_partidas)} – ${n1(x.recibidos / x.n_partidas)}`, x.dobles, x.subitas, n1(x.minutos)]));
    tabla('#t-dia', [['Día'], ['Jugadores', 1], ['Partidas', 1], ['Minutos', 1]], dias.map((d) => [new Date(d.dia).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }), d.jugadores, d.n_partidas, n1(d.minutos)]));
    tabla('#t-op', [['Cuándo'], ['Apodo'], ['★', 1], ['Comentario']], ops.map((o) => [fecha(o.creada), esc(o.apodo), '★'.repeat(o.estrellas) + '☆'.repeat(5 - o.estrellas), `<span class="coment">${esc(o.texto ?? '')}</span>`]));
    tabla('#t-par', [['Cuándo'], ['Apodo'], ['Rival'], ['Resultado'], ['Tocados', 1], ['DT', 1], ['MS', 1], ['Min', 1]],
      par.map((p) => [fecha(p.creada), esc(p.apodo), nombreNivel(p.nivel), p.gano ? 'Ganó' : 'Perdió', `${p.tocados_dados} – ${p.tocados_recibidos}`, p.dobles, p.subitas, p.version === 'historico' ? 'hist.' : p.duracion_s ? n1(p.duracion_s / 60) : '·']));
    $('#datos').hidden = false;
    msg.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-ES') + '. "Conectado" = ha avisado en los últimos 3 minutos. Las partidas históricas no tienen duración ni cuentan en la actividad por día.';
  } catch (err) {
    $('#datos').hidden = true;
    msg.className = 'error';
    msg.textContent = err.status === 400 ? 'Contraseña incorrecta, o falta ejecutar la actualización en Supabase.' : 'No se ha podido cargar. Comprueba la conexión.';
  }
});
</script>
</body>
</html>
